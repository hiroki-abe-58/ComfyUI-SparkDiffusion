name: Publish to Comfy registry

# Publishes the version in pyproject.toml to https://registry.comfy.org/nodes/sparkdiffusion
# whenever pyproject.toml changes on main (bump `version` to release), or manually.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  quality:
    name: Model-free quality gate
    if: ${{ github.repository == 'hiroki-abe-58/ComfyUI-SparkDiffusion' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and registry security rules
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m ruff check . --select S102,S307,E702
      - name: Tests
        run: python -m pytest -q

  publish-node:
    name: Publish Custom Node to registry
    needs: quality
    if: ${{ github.repository == 'hiroki-abe-58/ComfyUI-SparkDiffusion' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
