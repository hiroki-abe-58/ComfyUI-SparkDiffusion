[project]
name = "comfyui-sparkdiffusion"
version = "0.1.0"
description = "ComfyUI integration for SparkDiffusion sparse few-step Wan video generation, with RTX 50-series and FP8 focused support."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The ComfyUI side has no extra dependencies. SparkDiffusion itself runs in a separate
# runtime interpreter; see requirements-runtime.txt and the README.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-SparkDiffusion"
Issues = "https://github.com/hiroki-abe-58/ComfyUI-SparkDiffusion/issues"
Upstream = "https://github.com/AlibabaResearch/SparkDiffusion"

[tool.comfy]
DisplayName = "ComfyUI-SparkDiffusion"
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["benchmarks/local"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
