[project]
# Comfy Registry node ID (immutable once published): https://registry.comfy.org/nodes/sparkdiffusion
name = "sparkdiffusion"
version = "0.1.1"
description = "Run AlibabaResearch SparkDiffusion (RoLA sparse attention + CrossDistill few-step) Wan2.1/2.2 video generation from ComfyUI in an isolated runtime, with RTX 50-series / FP8 focused support. Independent community integration, not an official AlibabaResearch project."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Intentionally empty: nothing is installed into ComfyUI's Python. SparkDiffusion runs in a
# separate runtime interpreter set up by the user (see requirements-runtime.txt and the README).
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-SparkDiffusion"
Documentation = "https://github.com/hiroki-abe-58/ComfyUI-SparkDiffusion#readme"
Issues = "https://github.com/hiroki-abe-58/ComfyUI-SparkDiffusion/issues"
Upstream = "https://github.com/AlibabaResearch/SparkDiffusion"

[tool.comfy]
PublisherId = "hiroki-abe-58"
DisplayName = "SparkDiffusion for ComfyUI"
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["benchmarks/local"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
